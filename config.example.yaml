feeds:
  - name: "Lenny's Podcast"
    url: "https://api.substack.com/feed/podcast/10845.rss"
  # - name: "Another Podcast"
  #   url: "https://example.com/feed.xml"

settings:
  whisper_model: "medium"
  llm_provider: "omlx"
  ollama_model: "gemma3" # Used when llm_provider is "ollama"
  omlx_model: "gemma-4-12b-coder-fable5-composer2.5-4bit"
  omlx_base_url: "http://127.0.0.1:10000/v1"
  omlx_api_key: "" # Set to the key configured in oMLX, if required
  max_episodes_per_feed: 3
  # Transcript chars fed to the summarizer. 0 disables the cap.
  max_transcript_chars: 240000
  # Ceiling for the per-episode num_ctx sizing.
  max_context_tokens: 131072
  # Output token budget. Reasoning models (qwen3.8) spend this on thinking
  # before writing; 2048 truncated summaries and dropped sections.
  summary_num_predict: 4096
  # Long transcripts are summarized in chunks before final synthesis.
  summary_chunk_chars: 60000
  summary_chunk_overlap_chars: 1000
  summary_chunk_num_predict: 3072
  backfill_episodes: 3
  keep_audio: false

summary:
  listener_interests: "tech and business"
  sections:
    - heading: "Summary"
      instruction: "2-3 paragraph summary of the episode's main discussion and the guest's credibility/background"
    - heading: "Key Points"
      instruction: "Each major insight, claim, or framework discussed. Include specific numbers, stats, or data points. Note any contrarian or non-obvious takes."
      format: "bullets"
    - heading: "Tools & Resources"
      instruction: "Any tools, apps, books, courses, or people mentioned worth checking out"
      format: "bullets"
    - heading: "Quotable"
      instruction: "1-2 standout quotes from the episode worth remembering"
      format: "quotes"
    - heading: "Action Items"
      instruction: "Specific skills to develop, business/career moves to consider, books to read, tools to try, people to follow, health/fitness/mindset practices mentioned"
      format: "checklist"

digest:
  enabled: false
  sections:
    - "Summary"
    - "Key Points"
    - "Action Items"
  output_dir: "digests"

notify:
  enabled: false  # macOS desktop banner when a full run completes (true/1 to enable; macOS only)

search:
  transcript_index: true  # build/update the SQLite FTS5 keyword index over raw/ each run
